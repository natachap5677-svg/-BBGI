<script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwW0xcNEvHoQ-fE9f4Sl4eK0110nphDxTm7DGJIRAKySj7i6jIqGsHdc5dxyXhjG42_7Q/exec'; 

        window.onload = async function() {
            if(localStorage.getItem('bbgi_practical_submitted')) {
                document.getElementById('already-submitted').classList.remove('hidden');
                return;
            }
            
            document.getElementById('main-form-container').classList.remove('hidden');

            try {
                const response = await fetch(SCRIPT_URL + '?action=getQuestions');
                const data = await response.json();
                
                renderTable('p4-tbody', data.part4, 'p4_score_');
                renderTable('p5-tbody', data.part5, 'p5_score_');
                renderTable('p6-tbody', data.part6, 'p6_score_');
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('forms-container').classList.remove('hidden');
            } catch (error) {
                document.getElementById('loading').innerText = 'เกิดข้อผิดพลาดในการโหลดข้อมูล กรุณารีเฟรชหน้าเว็บ';
            }
        }

        // ฟังก์ชันสร้างตารางคะแนน 5 4 3 2 1 (เอา - ออกแล้ว)
        function renderTable(tbodyId, questions, prefix) {
            const tbody = document.getElementById(tbodyId);
            const scores = [5, 4, 3, 2, 1]; // เอา - ออก
            
            questions.forEach((q, index) => {
                let radiosHtml = '';
                scores.forEach(s => {
                    radiosHtml += `<td class="border p-1 sm:p-2"><input type="radio" name="${prefix}${index}" value="${s}" required class="w-4 h-4 cursor-pointer"></td>`;
                });
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 text-xs sm:text-sm">
                        <td class="border p-2 text-left leading-relaxed">${q}</td>
                        ${radiosHtml}
                    </tr>
                `;
            });
        }

        async function submitForm(event) {
            event.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "กำลังบันทึกข้อมูล..."; btn.disabled = true;

            const form = event.target;
            const formData = new FormData(form);
            
            let dept = formData.get('department');
            if (dept === 'อื่นๆ') dept = "อื่นๆ: " + formData.get('department_other');
            
            let job = formData.get('jobRole');
            if (job === 'อื่นๆ') job = "อื่นๆ: " + formData.get('jobRole_other');

            let supports = formData.getAll('s7_support');
            if(formData.get('s7_support_other_check')) {
                supports.push("อื่นๆ: " + formData.get('s7_support_other_text'));
            }
            let supportStr = supports.join(", ");

            let p4Scores = {}, p5Scores = {}, p6Scores = {};
            for (let [key, value] of formData.entries()) {
                if(key.startsWith('p4_')) p4Scores[key] = value;
                if(key.startsWith('p5_')) p5Scores[key] = value;
                if(key.startsWith('p6_')) p6Scores[key] = value;
            }

            const submitData = {
                formType: 'practical',
                department: dept, group: formData.get('group'), experience: formData.get('experience'), jobRole: job,
                p4Scores: p4Scores, p5Scores: p5Scores, p6Scores: p6Scores,
                s7_work: formData.get('s7_work'), s7_result: formData.get('s7_result'), s7_support: supportStr,
                s8_improve1: formData.get('s8_improve1'), s8_improve2: formData.get('s8_improve2'), s8_improve3: formData.get('s8_improve3'), s8_suggestion: formData.get('s8_suggestion')
            };

            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(submitData) });
                Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ!', text: 'ขอบคุณที่ให้ความร่วมมือ', confirmButtonColor: '#1e3a8a' })
                .then(() => {
                    localStorage.setItem('bbgi_practical_submitted', 'true');
                    window.location.reload();
                });
            } catch (error) {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถบันทึกได้ โปรดลองอีกครั้ง', 'error');
                btn.innerText = "ส่งแบบประเมินภาคปฏิบัติ"; btn.disabled = false;
            }
        }
    </script>
